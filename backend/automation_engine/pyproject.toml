[project]
name = "automation_engine"
version = "1.1.0"

dependencies = [
  "playwright>=1.55.0,<2.0.0",
  "pydantic>=2.12.5,<3.0.0",
  "python-dotenv>=1.2.1,<2.0.0",
  "pydantic_ai",
  "logfire",
  "rapidfuzz",
  "playwright_stealth",
  "playwright_captcha",
  "genai-prices",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["**/assets/*.js"]