services:
  web:
    build: .
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
  redis:
    image: redis:8.2.5-bookworm
    container_name: redis
    ports:
        - "6379:6379"
    command: redis-server 
  celery_worker:
    build:
        context: .
        dockerfile: Dockerfile.worker
    container_name: celery_worker
    command: celery -A src.runs.celery_app worker --loglevel=info
    depends_on:
        - redis
        - web
    working_dir: /app/web
    env_file:
      - .env
    volumes:
      - ./:/app
  
  minio:
    image: quay.io/minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    volumes:
      - ./minio_data:/data
    command: server /data --console-address ":9001"
